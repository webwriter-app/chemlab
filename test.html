<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<title>Chemistry Lab — test page</title>
		<style>
			body {
				margin: 0;
				font-family: system-ui, sans-serif;
				padding: 1rem;
			}
			h1 {
				font-size: 1rem;
				font-weight: 600;
				margin: 0 0 0.75rem;
			}
			webwriter-chemlab {
				display: block;
				min-height: 640px;
				border: 1px solid #ccc;
				border-radius: 4px;
			}
		</style>

		<!-- The widget's base class (LitElementWw) uses @open-wc/scoped-elements,
		     which needs the scoped custom element registry. Chrome has no native
		     support yet, so load the polyfill first (WebWriter's runtime does the
		     same). -->
		<script type="module">
			import "@webcomponents/scoped-custom-element-registry";
		</script>

		<!-- Importing the widget entry registers <webwriter-chemlab>.
		     Vite resolves the TypeScript + node_modules for us. -->
		<script type="module" src="./webwriter-chemlab.ts"></script>
	</head>
	<body>
		<h1>Chemistry Lab — test page (acid/base titration preset)</h1>

		<!-- Seeded with the bundled titration example so there is something to
		     interact with immediately. Clear the attributes for an empty lab. -->
		<webwriter-chemlab
			availablemolecules="[{&quot;formula&quot;:&quot;OH2&quot;,&quot;atoms&quot;:[&quot;oxygen&quot;,&quot;hydrogen&quot;,&quot;hydrogen&quot;],&quot;bonds&quot;:[&quot;0-1:covalent:1&quot;,&quot;0-2:covalent:1&quot;]},{&quot;formula&quot;:&quot;NaOH&quot;,&quot;atoms&quot;:[&quot;sodium&quot;,&quot;oxygen&quot;,&quot;hydrogen&quot;],&quot;bonds&quot;:[&quot;0-1:acidbase:1&quot;,&quot;1-2:covalent:1&quot;]},{&quot;formula&quot;:&quot;HCl&quot;,&quot;atoms&quot;:[&quot;hydrogen&quot;,&quot;chlorine&quot;],&quot;bonds&quot;:[&quot;0-1:acidbase:1&quot;]},{&quot;formula&quot;:&quot;NaCl&quot;,&quot;atoms&quot;:[&quot;sodium&quot;,&quot;chlorine&quot;],&quot;bonds&quot;:[&quot;0-1:ionic:1&quot;]}]"
			availablemixtures="[{&quot;name&quot;:&quot;Salzsäure1M&quot;,&quot;content&quot;:[&quot;OH2:55.410&quot;,&quot;HCl:1&quot;]},{&quot;name&quot;:&quot;Natronlauge1M&quot;,&quot;content&quot;:[&quot;OH2:55.410&quot;,&quot;NaOH:1&quot;]}]"
			availablecomponents="[{&quot;type&quot;:&quot;Beaker&quot;,&quot;content&quot;:&quot;Salzsäure1M&quot;,&quot;vol&quot;:0.01,&quot;pos&quot;:[512,505.390625],&quot;voltage&quot;:&quot;&quot;,&quot;current&quot;:&quot;&quot;,&quot;material&quot;:&quot;&quot;,&quot;connections&quot;:[],&quot;id&quot;:0},{&quot;type&quot;:&quot;Burette&quot;,&quot;content&quot;:&quot;Natronlauge1M&quot;,&quot;vol&quot;:0.02,&quot;pos&quot;:[510,212.390625],&quot;voltage&quot;:&quot;&quot;,&quot;current&quot;:&quot;&quot;,&quot;material&quot;:&quot;&quot;,&quot;connections&quot;:[],&quot;id&quot;:1}]"
			panelvariant="1"
			invcomponents=""
			enablexapi="false"
			xapikey=""
		></webwriter-chemlab>
	</body>
</html>
